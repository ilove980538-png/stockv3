<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>StockOS v2 — 謝先生投資中心</title>
<style>
:root{
  --bg:#050810;--bg2:#0c1120;--bg3:#131929;--bg4:#1a2235;--bg5:#202a42;
  --b:rgba(255,255,255,0.07);--b2:rgba(255,255,255,0.13);--b3:rgba(255,255,255,0.22);
  --t:#e2e8f4;--t2:#8892a8;--t3:#4a5572;
  --green:#00d4aa;--g2:rgba(0,212,170,0.13);
  --red:#ff4d6d;--r2:rgba(255,77,109,0.13);
  --blue:#4fa3e8;--bl2:rgba(79,163,232,0.13);
  --amber:#f6c90e;--am2:rgba(246,201,14,0.13);
  --purple:#9f7aea;--pu2:rgba(159,122,234,0.13);
  --cyan:#22d3ee;--cy2:rgba(34,211,238,0.13);
  --orange:#fb923c;--or2:rgba(251,146,60,0.13);
  --acc:#00d4aa;
  --r:12px;--rs:8px;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono','Fira Code',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--t);font-family:var(--font);font-size:13px;min-height:100vh;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}

/* ─── TOPBAR ─── */
.topbar{position:sticky;top:0;z-index:200;background:rgba(5,8,16,0.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 14px;height:50px;gap:10px;}
.logo{font-size:13px;font-weight:700;color:var(--acc);white-space:nowrap;letter-spacing:-0.3px;}
.logo sub{font-size:9px;color:var(--t3);font-weight:400;margin-left:4px;}
.tb-search{flex:1;max-width:260px;position:relative;}
.tb-search input{width:100%;background:var(--bg3);border:1px solid var(--b);border-radius:7px;padding:6px 10px 6px 28px;color:var(--t);font-size:12px;outline:none;transition:border .2s;}
.tb-search input:focus{border-color:var(--acc);}
.tb-search input::placeholder{color:var(--t3);}
.tb-si{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:12px;pointer-events:none;}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.mkt{font-size:10px;padding:3px 7px;border-radius:4px;font-weight:600;white-space:nowrap;}
.mkt-o{background:var(--g2);color:var(--green);}
.mkt-c{background:var(--r2);color:var(--red);}
.tbb{background:none;border:1px solid var(--b2);color:var(--t2);border-radius:6px;padding:5px 9px;font-size:11px;cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:4px;font-family:var(--font);}
.tbb:hover{border-color:var(--acc);color:var(--acc);}
.tbb.danger:hover{border-color:var(--red);color:var(--red);}
.tbb svg{transition:transform .3s;}
.tbb.spin svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ─── TABS ─── */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--b);overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;}
.tabs::-webkit-scrollbar{height:0;}
.tabt{padding:11px 14px;font-size:11px;font-weight:500;color:var(--t3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font);}
.tabt:hover{color:var(--t2);}
.tabt.on{color:var(--acc);border-bottom-color:var(--acc);}

/* ─── CONTENT ─── */
.content{padding:14px;max-width:1200px;margin:0 auto;}
.sec{display:none;}
.sec.on{display:block;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr;}}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr;}}

/* ─── CARDS ─── */
.card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:14px;}
.csm{background:var(--bg3);border:1px solid var(--b);border-radius:var(--rs);padding:11px;}
.chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.ctit{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:5px;}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}

/* ─── STAT CARDS ─── */
.sc{background:var(--bg3);border-radius:var(--rs);padding:12px;border:1px solid var(--b);position:relative;overflow:hidden;}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.sc-g::before{background:var(--green);}
.sc-r::before{background:var(--red);}
.sc-b::before{background:var(--blue);}
.sc-a::before{background:var(--amber);}
.sc-p::before{background:var(--purple);}
.slbl{font-size:9px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.sval{font-family:var(--mono);font-size:18px;font-weight:700;line-height:1;}
.ssub{font-size:9px;color:var(--t2);margin-top:3px;}
.up{color:var(--green)!important;}
.dn{color:var(--red)!important;}
.nt{color:var(--t2)!important;}

/* ─── TABLE ─── */
.tbl{width:100%;border-collapse:collapse;font-size:11px;}
.tbl th{font-size:9px;color:var(--t3);font-weight:500;text-align:left;padding:5px 7px;border-bottom:1px solid var(--b);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;}
.tbl th.r{text-align:right;}
.tbl td{padding:8px 7px;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle;}
.tbl td.r{text-align:right;}
.tbl tr:hover td{background:rgba(255,255,255,0.02);}
.tbl tr:last-child td{border-bottom:none;}
.mono{font-family:var(--mono);}
.sym{font-family:var(--mono);font-weight:700;font-size:12px;}

/* ─── SCORE TABLE SPECIFIC ─── */
.score-tbl-wrap{overflow-x:auto;max-height:70vh;overflow-y:auto;}
.score-tbl-wrap::-webkit-scrollbar{width:4px;height:4px;}
.stbl{width:100%;border-collapse:collapse;font-size:11px;}
.stbl thead{position:sticky;top:0;z-index:10;background:var(--bg2);}
.stbl th{font-size:9px;color:var(--t3);font-weight:600;text-align:left;padding:6px 7px;border-bottom:1px solid var(--b2);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;cursor:pointer;user-select:none;background:var(--bg2);}
.stbl th:hover{color:var(--acc);}
.stbl th.r{text-align:right;}
.stbl td{padding:7px 7px;border-bottom:1px solid rgba(255,255,255,0.025);vertical-align:middle;white-space:nowrap;}
.stbl td.r{text-align:right;}
.stbl tr:hover td{background:rgba(255,255,255,0.02);}
.stbl tr:last-child td{border-bottom:none;}
/* freeze first 2 cols */
.stbl th:nth-child(1),.stbl td:nth-child(1){position:sticky;left:0;z-index:5;background:var(--bg2);}
.stbl th:nth-child(2),.stbl td:nth-child(2){position:sticky;left:64px;z-index:5;background:var(--bg2);}
.stbl thead th:nth-child(1),.stbl thead th:nth-child(2){z-index:11;}
.stbl tr:hover td:nth-child(1),.stbl tr:hover td:nth-child(2){background:var(--bg3);}

/* ─── BADGE / CHIP ─── */
.bdg{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:600;}
.b-g{background:var(--g2);color:var(--green);}
.b-r{background:var(--r2);color:var(--red);}
.b-b{background:var(--bl2);color:var(--blue);}
.b-a{background:var(--am2);color:var(--amber);}
.b-p{background:var(--pu2);color:var(--purple);}
.b-c{background:var(--cy2);color:var(--cyan);}
.b-o{background:var(--or2);color:var(--orange);}
.b-gray{background:rgba(255,255,255,0.06);color:var(--t2);}

/* ─── STARS ─── */
.stars{font-size:11px;}
.sf{color:var(--amber);}
.se{color:var(--t3);}

/* ─── SCORE BARS ─── */
.sbar-wrap{display:flex;gap:2px;align-items:center;}
.sbar-seg{width:8px;height:8px;border-radius:2px;}
.sbar-on{background:var(--amber);}
.sbar-off{background:var(--b2);}

/* ─── SR BAR ─── */
.srbar{position:relative;height:24px;margin:10px 0 18px;}
.srbar-track{position:absolute;top:50%;left:0;right:0;height:2px;transform:translateY(-50%);background:var(--b2);border-radius:1px;}
.srbar-fill{position:absolute;top:50%;height:2px;transform:translateY(-50%);border-radius:1px;}
.srbar-dot{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;}
.srbar-lbl{position:absolute;font-size:8px;font-family:var(--mono);white-space:nowrap;background:var(--bg3);padding:1px 4px;border-radius:3px;border:1px solid var(--b2);}

/* ─── MODAL ─── */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;padding:14px;}
.mbg.on{display:flex;}
.mdl{background:var(--bg2);border:1px solid var(--b2);border-radius:var(--r);padding:20px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
.mdl h3{font-size:14px;margin-bottom:14px;}
.mdl label{font-size:10px;color:var(--t2);display:block;margin-bottom:3px;margin-top:10px;text-transform:uppercase;letter-spacing:.4px;}
.mdl input,.mdl select,.mdl textarea{width:100%;background:var(--bg3);border:1px solid var(--b);border-radius:6px;padding:9px 10px;color:var(--t);font-size:14px;outline:none;font-family:var(--font);}
.mdl input:focus,.mdl select:focus,.mdl textarea:focus{border-color:var(--acc);}
.mdl input::placeholder{color:var(--t3);}
.mdl select option{background:var(--bg3);}
.mbtns{display:flex;gap:8px;margin-top:14px;}
.btn-ok{flex:1;background:var(--acc);color:#000;border:none;border-radius:7px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);}
.btn-sell{flex:1;background:var(--red);color:#fff;border:none;border-radius:7px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-x{background:none;border:1px solid var(--b2);color:var(--t2);border-radius:7px;padding:10px 12px;font-size:13px;cursor:pointer;}
.rrow{display:flex;gap:14px;margin-top:4px;}
.rrow label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t);cursor:pointer;margin:0;text-transform:none;letter-spacing:0;}
.divhr{border:none;border-top:1px solid var(--b);margin:10px 0;}

/* ─── SECTOR FILTER BAR ─── */
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
.fpill{padding:4px 10px;border-radius:20px;font-size:10px;cursor:pointer;border:1px solid var(--b);color:var(--t2);background:none;transition:all .15s;font-family:var(--font);white-space:nowrap;}
.fpill:hover{border-color:var(--acc);color:var(--acc);}
.fpill.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600;}
.fsel{background:var(--bg3);border:1px solid var(--b);border-radius:6px;padding:4px 8px;color:var(--t);font-size:11px;outline:none;font-family:var(--font);}
.fsel option{background:var(--bg3);}
.finp{background:var(--bg3);border:1px solid var(--b);border-radius:6px;padding:4px 8px;color:var(--t);font-size:11px;outline:none;font-family:var(--font);width:100px;}
.finp::placeholder{color:var(--t3);}

/* ─── AI BOX ─── */
.aibox{background:var(--bg3);border:1px solid var(--b);border-radius:var(--rs);padding:12px;margin-bottom:8px;}
.aiscore{display:flex;gap:8px;flex-wrap:wrap;}
.asc{display:flex;flex-direction:column;align-items:center;padding:8px 12px;border-radius:var(--rs);min-width:72px;}
.asc-val{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1;}
.asc-lbl{font-size:8px;opacity:.7;margin-top:2px;text-align:center;}
.asc-hot{background:var(--am2);color:var(--amber);}
.asc-bull{background:var(--g2);color:var(--green);}
.asc-tech{background:var(--bl2);color:var(--blue);}
.aisumm{font-size:11px;line-height:1.75;color:var(--t2);}
.aisumm strong{color:var(--t);}
.pulse-wrap{display:flex;flex-direction:column;gap:7px;}
.pulse{background:linear-gradient(90deg,var(--bg3) 25%,rgba(255,255,255,.04) 50%,var(--bg3) 75%);background-size:200% 100%;animation:sh 1.5s infinite;border-radius:4px;}
@keyframes sh{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ─── SECTOR HEAT ─── */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.schip{padding:9px;border-radius:var(--rs);cursor:pointer;transition:all .15s;}
.schip:hover{transform:scale(1.02);}
.sname{font-size:9px;font-weight:600;margin-bottom:2px;}
.spct{font-family:var(--mono);font-size:13px;font-weight:700;}
.sh2{background:rgba(0,212,170,.18);color:var(--green);}
.sh1{background:rgba(0,212,170,.08);color:#00b894;}
.sn0{background:rgba(255,255,255,.04);color:var(--t2);}
.sc1{background:rgba(255,77,109,.08);color:var(--red);}
.sc2{background:rgba(255,77,109,.18);color:var(--red);}

/* ─── WATCHLIST ─── */
.witem{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--b);cursor:pointer;transition:.15s;}
.witem:last-child{border-bottom:none;}
.witem:hover{opacity:.8;}
.wsym{font-family:var(--mono);font-weight:700;font-size:12px;min-width:50px;}
.wname{flex:1;font-size:10px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wpr{font-family:var(--mono);font-size:11px;text-align:right;font-weight:500;}
.wchg{font-size:9px;text-align:right;}

/* ─── ACTION BTNS ─── */
.abt{background:none;border:1px solid var(--b2);border-radius:5px;padding:3px 7px;font-size:9px;cursor:pointer;transition:all .15s;font-family:var(--font);}
.abt-g{color:var(--green);border-color:rgba(0,212,170,.3);}
.abt-g:hover{background:var(--g2);}
.abt-r{color:var(--red);border-color:rgba(255,77,109,.3);}
.abt-r:hover{background:var(--r2);}
.abt-b{color:var(--blue);border-color:rgba(79,163,232,.3);}
.abt-b:hover{background:var(--bl2);}
.abt-gray{color:var(--t3);}
.abt-gray:hover{color:var(--red);}

/* ─── EMPTY ─── */
.empty{padding:24px;text-align:center;color:var(--t3);font-size:11px;}

/* ─── TARGET BAR ─── */
.tpbar{height:3px;background:var(--b2);border-radius:2px;margin-top:3px;overflow:hidden;}
.tpfill{height:100%;background:var(--acc);border-radius:2px;}

/* ─── ADD COL CHIP ─── */
.custom-cols{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0;}
.cc{display:flex;align-items:center;gap:3px;background:var(--bg4);border:1px solid var(--b2);border-radius:4px;padding:2px 7px;font-size:9px;color:var(--t2);}
.cc button{background:none;border:none;color:var(--t3);cursor:pointer;font-size:10px;padding:0;}
.cc button:hover{color:var(--red);}

/* ─── EXPORT / IMPORT ─── */
.eibtn{background:none;border:1px solid var(--b2);color:var(--t2);border-radius:6px;padding:5px 10px;font-size:10px;cursor:pointer;font-family:var(--font);transition:all .2s;}
.eibtn:hover{border-color:var(--acc);color:var(--acc);}
.eibtn.imp{border-color:rgba(79,163,232,.4);color:var(--blue);}
.eibtn.imp:hover{background:var(--bl2);}
.eibtn.exp{border-color:rgba(0,212,170,.4);color:var(--green);}
.eibtn.exp:hover{background:var(--g2);}

/* ─── ADVISOR ─── */
.adv-card{background:var(--bg3);border:1px solid var(--b);border-radius:var(--rs);padding:14px;margin-bottom:8px;}
.adv-card.highlight{border-color:rgba(246,201,14,.35);background:rgba(246,201,14,.04);}
.adv-card.green-hl{border-color:rgba(0,212,170,.35);background:rgba(0,212,170,.04);}
.adv-card.red-hl{border-color:rgba(255,77,109,.35);background:rgba(255,77,109,.04);}
.adv-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.adv-title{font-size:12px;font-weight:700;color:var(--t);}
.adv-sub{font-size:10px;color:var(--t3);margin-top:2px;}
.adv-body{font-size:11px;line-height:1.8;color:var(--t2);}
.adv-body strong{color:var(--t);}
.adv-body .hl-g{color:var(--green);font-weight:600;}
.adv-body .hl-r{color:var(--red);font-weight:600;}
.adv-body .hl-a{color:var(--amber);font-weight:600;}
.adv-body .hl-b{color:var(--blue);font-weight:600;}
.adv-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px;}
.adv-table th{font-size:9px;color:var(--t3);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--b);text-transform:uppercase;letter-spacing:.4px;text-align:left;}
.adv-table th.r{text-align:right;}
.adv-table td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.025);vertical-align:middle;}
.adv-table td.r{text-align:right;font-family:var(--mono);}
.adv-table tr:last-child td{border-bottom:none;}
.adv-table tr:hover td{background:rgba(255,255,255,.02);}
.rr-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;}
.rr4{background:rgba(246,201,14,.15);color:var(--amber);border:1px solid rgba(246,201,14,.3);}
.rr3{background:rgba(0,212,170,.12);color:var(--green);border:1px solid rgba(0,212,170,.25);}
.action-chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px;}
.ac-sell{background:var(--r2);color:var(--red);border:1px solid rgba(255,77,109,.3);}
.ac-hold{background:rgba(255,255,255,.06);color:var(--t2);border:1px solid var(--b2);}
.ac-buy{background:var(--g2);color:var(--green);border:1px solid rgba(0,212,170,.3);}
.ac-reduce{background:var(--am2);color:var(--amber);border:1px solid rgba(246,201,14,.3);}
.ac-watch{background:var(--bl2);color:var(--blue);border:1px solid rgba(79,163,232,.3);}
.snap-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--b);flex-wrap:wrap;}
.snap-row:last-child{border-bottom:none;}
.prog-bar{flex:1;min-width:60px;height:3px;background:var(--b2);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">StockOS<sub id="verLbl">v2.3</sub></div>
  <div class="tb-search">
    <span class="tb-si">⌕</span>
    <input type="text" id="gSearch" placeholder="輸入代號 Enter 加入觀察/分析..." />
  </div>
  <div class="tb-r">
    <span class="mkt" id="mktBadge">—</span>
    <span style="font-size:9px;color:var(--t3)" id="lastUpd">—</span>
    <button class="tbb" id="refreshBtn" onclick="doRefresh()">
      <svg id="refIco" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      刷新
    </button>
    <button class="tbb" onclick="openBuyMdl()">＋買入</button>
    <button class="tbb" style="color:var(--blue)" onclick="openCashMdl()">$現金</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tabt on" onclick="goTab('overview',this)">📊總覽</button>
  <button class="tabt" onclick="goTab('myport',this)">💼我的</button>
  <button class="tabt" onclick="goTab('dadport',this)">👨爸爸</button>
  <button class="tabt" onclick="goTab('watchlist',this)">👁觀察</button>
  <button class="tabt" onclick="goTab('aianalysis',this)">🤖AI分析</button>
  <button class="tabt" onclick="goTab('scoretable',this)">⭐評分表</button>
  <button class="tabt" onclick="goTab('cashlog',this)">💰現金日誌</button>
  <button class="tabt" onclick="goTab('perf',this)">📈績效</button>
  <button class="tabt" onclick="goTab('advisor',this)" style="color:var(--amber);font-weight:700">🧠AI顧問</button>

/* ═══════════════════════════════════════
   TECHNICAL INDICATORS
═══════════════════════════════════════ */
function calcMA(c,p){if(!c||c.length<p)return null;return c.slice(-p).reduce((a,b)=>a+b,0)/p;}
function calcEMA(c,p){
  if(!c||c.length<p)return null;
  let k=2/(p+1),ema=c.slice(0,p).reduce((a,b)=>a+b,0)/p;
  for(let i=p;i<c.length;i++)ema=c[i]*k+ema*(1-k);
  return ema;
}
function calcRSI(c,p=14){
  if(!c||c.length<p+1)return null;
  let g=0,l=0;
  for(let i=c.length-p;i<c.length;i++){const d=c[i]-c[i-1];if(d>0)g+=d;else l+=Math.abs(d);}
  const ag=g/p,al=l/p;if(al===0)return 100;
  return 100-(100/(1+ag/al));
}
function calcMACD(c){
  if(!c||c.length<26)return null;
  const e12=calcEMA(c,12),e26=calcEMA(c,26);
  if(!e12||!e26)return null;
  const macd=e12-e26;
  // signal: EMA9 of MACD (simplified)
  return{macd,signal:macd*0.9,hist:macd*0.1};
}
function calcBoll(c,p=20){
  if(!c||c.length<p)return null;
  const sl=c.slice(-p);const ma=sl.reduce((a,b)=>a+b,0)/p;
  const std=Math.sqrt(sl.reduce((a,b)=>a+Math.pow(b-ma,2),0)/p);
  return{upper:ma+2*std,mid:ma,lower:ma-2*std};
}
function calcKDJ(h,l,c,p=9){
  if(!h||!l||!c||c.length<p)return null;
  const sl_h=h.slice(-p),sl_l=l.slice(-p);
  const hh=Math.max(...sl_h),ll=Math.min(...sl_l);
  const cur=c[c.length-1];
  const rsv=hh===ll?50:(cur-ll)/(hh-ll)*100;
  const K=rsv*0.333+50*0.667;const D=K*0.333+50*0.667;const J=3*K-2*D;
  return{K,D,J};
}
function calcSR(cd){
  if(!cd?.h?.length)return{};
  const h=cd.h,l=cd.l,c=cd.c;const cur=c[c.length-1];
  const r5h=Math.max(...h.slice(-5)),r5l=Math.min(...l.slice(-5));
  return{sup:r5l<cur?r5l:Math.min(...l.slice(-10)),res:r5h>cur?r5h:Math.max(...h.slice(-10)),sS:Math.min(...l)*1.005,sR:Math.max(...h)*0.995};
}
function calcATR(cd,p=14){
  if(!cd?.h?.length||cd.h.length<p+1)return null;
  let atr=0;for(let i=cd.h.length-p;i<cd.h.length;i++){const tr=Math.max(cd.h[i]-cd.l[i],Math.abs(cd.h[i]-cd.c[i-1]),Math.abs(cd.l[i]-cd.c[i-1]));atr+=tr;}
  return atr/p;
}
function calcVol(c){if(!c||c.length<5)return null;const sl=c.slice(-5);return sl[sl.length-1]>sl.reduce((a,b)=>a+b,0)/sl.length*1.05?'放量':'縮量';}

}

function editCustomCell(sym,key,type,td){
  const cur=customData[sym]?.[key]||'';
  if(type==='stars'){
    const n=parseInt(cur)||0;
    const next=(n%5)+1;
    if(!customData[sym])customData[sym]={};customData[sym][key]=String(next);
    td.innerHTML=starsHtml(next);persist();return;
  }
  const v=prompt(`${sym} — 輸入值:`,cur);
  if(v===null)return;
  if(!customData[sym])customData[sym]={};customData[sym][key]=v;
  td.textContent=v;persist();
}
function removeCol(key){if(!confirm('確定刪除此欄位？'))return;customCols=customCols.filter(c=>c.key!==key);Object.values(customData).forEach(d=>delete d[key]);persist();renderScoreTable();}
function openAddColMdl(){document.getElementById('newColName').value='';openMdl('addColMdl');}
function doAddCol(){
  const name=document.getElementById('newColName').value.trim();
  const type=document.getElementById('newColType').value;
  if(!name)return;
  const key='c'+Date.now();customCols.push({key,name,type});persist();closeMdl('addColMdl');renderScoreTable();
}

  const totalMV=allH.reduce((s,h)=>s+h.mv,0);

- MA5=$${ma5?.toFixed(2)||'?'} MA10=$${ma10?.toFixed(2)||'?'} MA20=$${ma20?.toFixed(2)||'?'}
- RSI=${rsi?.toFixed(1)||'?'} MACD柱=${macd?.hist?.toFixed(3)||'?'} KDJ-J=${kdj?.J?.toFixed(1)||'?'}
- 布林上$${boll?.upper?.toFixed(2)||'?'} 下$${boll?.lower?.toFixed(2)||'?'}
- 支撐$${sr.sup?.toFixed(2)||'?'} 壓力$${sr.res?.toFixed(2)||'?'} ATR=$${atr?.toFixed(2)||'?'}
## 近期新聞
${newsH||'無'}`;
  }

  // ── 產業熱度快照 ──
  const sectorSnap=SETFS.map(e=>{const q=S.quotes[e.s];return`${e.n}:${q?.chp!=null?(q.chp>=0?'+':'')+q.chp.toFixed(1)+'%':'—'}`;}).join(' | ');

  // ── 持倉清單文字 ──

  }).join('\n');

  // ── 歷史交易摘要 ──
  const soldSnap=[...S.sm,...S.sd].slice(-10).map(r=>`${r.sym} ${r.gainP>=0?'+':''}${f(r.gainP)}%`).join(', ');

  const styleMap={bull:'樂觀派，傾向持有並積極加碼，接受較高波動，目標RR至少4:1',neutral:'中性派，平衡風險報酬，RR至少2:1',conservative:'保守派，優先保本，停損嚴格，RR至少1.5:1'};
  const modeMap={full:'針對全部持倉做綜合評估，每檔給出操作建議',single:`針對持倉中的 ${document.getElementById('advSym').value||'該標的'} 做深度分析`,rebalance:'分析資產配置比重，給出再平衡建議',exit:'專注分析哪些持倉應該獲利了結或減倉'};

${holdText||'無持倉'}

- 已實現損益 +$${f(realGain)} ｜勝率約 71% ｜平均報酬 21.63%
- 近期已實現：${soldSnap||'無'}

## 產業ETF熱度（今日）
${sectorSnap}
${singleTech}

---
只輸出JSON，不加任何說明。格式：{"overview":"","marketContext":"","holdings":[{"sym":"","action":"HOLD","urgency":"MED","currentPrice":0,"exitTarget":0,"addTarget":0,"stopLoss":0,"rr":"","reduceQty":"","reason":"","keyRisk":"","catalyst":""}],"cashAdvice":"","topPick":"","topExit":"","riskAlert":"","weeklyPlan":""}`;

  try{
    const resp=await fetch('/api/claude',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({model:CMODEL,max_tokens:1200,messages:[{role:'user',content:prompt}]})
    });
    // 先取得原始文字，方便 debug
    const rawBody=await resp.text();
    if(!resp.ok){
      let errMsg=`HTTP ${resp.status}`;
      try{const ej=JSON.parse(rawBody);errMsg=ej?.error?.message||errMsg;}catch{}
      throw new Error(errMsg);
    }
    const data=JSON.parse(rawBody);
    if(data.error){throw new Error(data.error.message||JSON.stringify(data.error));}
    const rawTxt=data.content?.find(c=>c.type==='text')?.text||'';
    if(!rawTxt){throw new Error('API 回傳空白內容');}
    let ai={};
    try{
      const clean=rawTxt.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
      const start=clean.indexOf('{');const end=clean.lastIndexOf('}');

      else ai=JSON.parse(clean);

      3. 去 <a href="https://console.anthropic.com" target="_blank" style="color:var(--blue)">console.anthropic.com</a> 取得 API Key</div>
    </div>`;
  }
  btn.textContent='🧠 生成建議';btn.disabled=false;
}

/* ═══════════════════════════════════════
   BUY / SELL / CASH
═══════════════════════════════════════ */
function openBuyMdl(){['bSym','bPrice','bQty'].forEach(id=>document.getElementById(id).value='');document.getElementById('bFee').value='0.99';openMdl('buyMdl');setTimeout(()=>document.getElementById('bSym').focus(),100);}
function openBuyMdlFor(acct){openBuyMdl();document.getElementById('bAcct').value=acct;}
function openBuyForSym(sym){openBuyMdl();document.getElementById('bSym').value=sym;}
function openCashMdl(){['cAmt','cNote'].forEach(id=>document.getElementById(id).value='');openMdl('cashMdl');}

function doBuy(){
  const sym=(document.getElementById('bSym').value||'').toUpperCase().trim();
  const price=parseFloat(document.getElementById('bPrice').value||'');
  const qty=parseFloat(document.getElementById('bQty').value||'');
  const fee=parseFloat(document.getElementById('bFee').value||'0')||0;
  const acct=document.getElementById('bAcct').value;
  if(!sym||!price||!qty){alert('請填入完整資訊');return;}
  const tc=price*qty+fee;
  const cash=acct==='my'?S.cm:S.cd;
  if(cash<tc){alert(`現金不足！需 $${f(tc)}，現有 $${f(cash)}`);return;}
  const idx=S.holdings.findIndex(h=>h.sym===sym&&h.acct===acct);
  if(idx>=0){const ex=S.holdings[idx];const nq=ex.qty+qty;S.holdings[idx]={...ex,qty:nq,cost:(ex.cost*ex.qty+tc)/nq,price};}
  else S.holdings.push({id:Date.now().toString(),sym,qty,cost:price,price,acct});
  const log={id:Date.now(),ts:new Date().toLocaleString('zh-TW'),cat:'股票買入',note:`${sym} ${qty}股@$${price}`,amt:-tc};
  if(acct==='my'){S.cm-=tc;S.lm.push(log);}else{S.cd-=tc;S.ld.push(log);}
  persist();closeMdl('buyMdl');renderAll();
}

function openSellMdl(id){
  const h=S.holdings.find(h=>h.id===id);if(!h)return;
  S.sellId=id;
  document.getElementById('sellTitle').textContent=`賣出 ${h.sym}`;
  document.getElementById('sellQtyD').textContent=f(h.qty,0)+' 股';
  document.getElementById('sellCostD').textContent=`$${f(h.cost)} / 股`;
  ['sSellQty','sSellPr'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('sSellFee').value='0.99';
  document.querySelector('input[name="stype"][value="all"]').checked=true;
  document.getElementById('partialWrap').style.display='none';
  openMdl('sellMdl');
}
function togSellType(v){document.getElementById('partialWrap').style.display=v==='partial'?'block':'none';}

function doSell(){
  const h=S.holdings.find(h=>h.id===S.sellId);if(!h)return;
  const type=document.querySelector('input[name="stype"]:checked').value;
  const qty=type==='all'?h.qty:parseFloat(document.getElementById('sSellQty').value||'');
  const price=parseFloat(document.getElementById('sSellPr').value||'');
  const fee=parseFloat(document.getElementById('sSellFee').value||'0')||0;
  if(!qty||!price){alert('請填入完整資訊');return;}
  if(qty>h.qty){alert('賣出股數超過持股');return;}
  const net=qty*price-fee;const cost=qty*h.cost;const gain=net-cost;
  if(qty>=h.qty)S.holdings=S.holdings.filter(x=>x.id!==h.id);
  else{const i=S.holdings.findIndex(x=>x.id===h.id);S.holdings[i]={...h,qty:h.qty-qty};}
  const rec={id:Date.now(),ts:new Date().toLocaleString('zh-TW'),sym:h.sym,qty,cost:h.cost,saleP:price,gain,gainP:cost>0?gain/cost*100:0};
  const log={id:Date.now(),ts:new Date().toLocaleString('zh-TW'),cat:'股票賣出',note:`${h.sym} ${qty}股@$${price}`,amt:net};
  if(h.acct==='my'){S.cm+=net;S.sm.push(rec);S.lm.push(log);}else{S.cd+=net;S.sd.push(rec);S.ld.push(log);}
  persist();closeMdl('sellMdl');renderAll();
}

function doCash(){
  const acct=document.getElementById('cAcct').value;
  const type=document.querySelector('input[name="ctype"]:checked').value;
  const amt=parseFloat(document.getElementById('cAmt').value||'');
  const note=document.getElementById('cNote').value;
  if(!amt||amt<=0){alert('請輸入有效金額');return;}
  const txAmt=type==='dep'?amt:-amt;
  const cash=acct==='my'?S.cm:S.cd;
  if(type==='wd'&&cash<amt){alert('現金不足');return;}
  const log={id:Date.now(),ts:new Date().toLocaleString('zh-TW'),cat:type==='dep'?'現金存入':'現金提領',note,amt:txAmt};
  if(acct==='my'){S.cm+=txAmt;S.lm.push(log);}else{S.cd+=txAmt;S.ld.push(log);}
  persist();closeMdl('cashMdl');renderAll();
}
function removeH(id){if(!confirm('確定移除？'))return;S.holdings=S.holdings.filter(h=>h.id!==id);persist();renderAll();}
function rmWatch(sym){S.wl=S.wl.filter(s=>s!==sym);persist();renderWL();}

/* ═══════════════════════════════════════
   EXPORT / IMPORT
═══════════════════════════════════════ */
function dlCSV(filename,csv){const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download=filename;a.click();}
function dlJSON(filename,obj){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(obj,null,2));a.download=filename;a.click();}

function exportPortCSV(acct){
  const list=acct?S.holdings.filter(h=>h.acct===acct):S.holdings;
  const rows=[['代號','帳戶','股數','成本/股','現價','總成本','市值','損益$','損益%'],...list.map(h=>{
    const p=S.quotes[h.sym]?.p??h.price;const c=h.cost*h.qty;const mv=p*h.qty;const gl=mv-c;
    return[h.sym,h.acct==='my'?'我的':'爸爸',h.qty,h.cost,p,c,mv,gl,(c>0?gl/c*100:0).toFixed(2)+'%'];
  })];
  dlCSV(`portfolio_${acct||'all'}_${new Date().toISOString().split('T')[0]}.csv`,rows.map(r=>r.join(',')).join('\n'));
}
function exportLogsCSV(){
  const all=[...S.lm.map(l=>({...l,who:'我的'})),...S.ld.map(l=>({...l,who:'爸爸'}))].sort((a,b)=>b.id-a.id);
  const rows=[['帳戶','類別','時間','備註','金額'],...all.map(l=>[l.who,l.cat,l.ts,l.note||'',l.amt])];
  dlCSV(`logs_${new Date().toISOString().split('T')[0]}.csv`,rows.map(r=>r.join(',')).join('\n'));
}
function exportPerfCSV(acct){
  const sold=acct==='my'?S.sm:S.sd;
  const rows=[['代號','時間','股數','成本','賣價','損益$','損益%'],...sold.map(r=>[r.sym,r.ts,r.qty,r.cost,r.saleP,r.gain.toFixed(2),(r.gainP||0).toFixed(2)+'%'])];
  dlCSV(`perf_${acct}_${new Date().toISOString().split('T')[0]}.csv`,rows.map(r=>r.join(',')).join('\n'));
}
function exportCSV(){
  const rows=[['代號','板塊','公司名','現價','目標均值','折價%','入手★','財報★','未來★','評級','說明'],...SCORE_DB.map(d=>{const p=S.quotes[d.sym]?.p??d.price;const disc=d.target?((d.target-p)/p*100).toFixed(1):'';;return[d.sym,SECTORS[d.sec]||d.sec,d.name,p,d.target||'',disc,d.buy,d.rep,d.fut,d.consensus,d.note||''];})];
  dlCSV(`scoretable_${new Date().toISOString().split('T')[0]}.csv`,rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'));
}
function exportJSON(){
  const obj={version:2,exported:new Date().toISOString(),holdings:S.holdings,cashMy:S.cm,cashDad:S.cd,logsMy:S.lm,logsDad:S.ld,soldMy:S.sm,soldDad:S.sd,watchlist:S.wl,customCols,customData};
  dlJSON(`stockos_backup_${new Date().toISOString().split('T')[0]}.json`,obj);
}
function importJSON(){openMdl('importMdl');document.getElementById('importText').value='';}
function doImport(){
  try{
    const obj=JSON.parse(document.getElementById('importText').value);
    if(!obj.version||obj.version!==2){alert('格式不符，請使用 v2 備份檔案');return;}
    if(!confirm('確定匯入？將覆蓋現有所有資料'))return;
    S.holdings=obj.holdings||[];S.cm=obj.cashMy||0;S.cd=obj.cashDad||0;
    S.lm=obj.logsMy||[];S.ld=obj.logsDad||[];S.sm=obj.soldMy||[];S.sd=obj.soldDad||[];
    S.wl=obj.watchlist||[];customCols=obj.customCols||[];customData=obj.customData||{};
    persist();closeMdl('importMdl');renderAll();alert('匯入成功！');
  }catch(e){alert('JSON格式錯誤：'+e.message);}
}
function loadFile(input){
  const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{document.getElementById('importText').value=e.target.result;doImport();};r.readAsText(f);
}

   MODAL HELPERS
═══════════════════════════════════════ */
function openMdl(id){document.getElementById(id).classList.add('on');}
function closeMdl(id){document.getElementById(id).classList.remove('on');}
// close on backdrop click
document.querySelectorAll('.mbg').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('on');}));

/* ═══════════════════════════════════════
   TABS & REFRESH
═══════════════════════════════════════ */
function goTab(id,btn){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tabt').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+id)?.classList.add('on');
  if(btn)btn.classList.add('on');
  else{const f=[...document.querySelectorAll('.tabt')].find(b=>b.getAttribute('onclick')?.includes("'"+id+"'"));if(f)f.classList.add('on');}
  renderActive(id);
}
function renderActive(id){
  if(id==='overview')renderOv();
  else if(id==='myport')renderPort('my');
  else if(id==='dadport')renderPort('dad');
  else if(id==='watchlist')renderWL();
  else if(id==='cashlog')renderCL();
  else if(id==='perf')renderPerf();
  else if(id==='scoretable'){buildSectorPills();renderScoreTable();}
  else if(id==='aianalysis'){renderScoreTable();fetchSectorHeat();}
  else if(id==='advisor'){
    // 更新單檔選擇器
    const sel=document.getElementById('advSym');
    const cur=sel.value;
    sel.innerHTML='<option value="">— 選股票 —</option>'+
      S.holdings.map(h=>`<option value="${h.sym}"${h.sym===cur?' selected':''}>${h.sym}(${h.acct==='my'?'我':'爸'})</option>`).join('');
    renderAdvHoldingSnap();
  }
}
function renderAll(){const el=document.querySelector('.sec.on');if(!el)return;renderActive(el.id.replace('tab-',''));}

async function doRefresh(){
  const btn=document.getElementById('refreshBtn');btn.classList.add('spin');
  const syms=[...new Set([...S.holdings.map(h=>h.sym),...S.wl])];
  const batches=[];for(let i=0;i<syms.length;i+=5)batches.push(syms.slice(i,i+5));
  for(const batch of batches){await Promise.all(batch.map(async sym=>{const q=await getQ(sym);if(q)S.quotes[sym]=q;}));await new Promise(r=>setTimeout(r,150));}
  btn.classList.remove('spin');
  document.getElementById('lastUpd').textContent='更新 '+new Date().toLocaleTimeString('zh-TW');
  renderAll();
}

// search
document.getElementById('gSearch').addEventListener('keydown',async e=>{
  if(e.key!=='Enter')return;
  const sym=e.target.value.trim().toUpperCase();if(!sym)return;e.target.value='';
  if(!S.wl.includes(sym)&&!S.holdings.some(h=>h.sym===sym)){S.wl.unshift(sym);persist();}
  const q=await getQ(sym);if(q)S.quotes[sym]=q;
  jumpAI(sym);
});

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
async function init(){
  updMkt();setInterval(updMkt,60000);
  buildSectorPills();renderScoreTable();renderOv();
  // 先從雲端載入，再刷新報價
  if(SYNC_ENABLED){const ok=await cloudLoad();if(ok)renderOv();}
  // bg fetch all quotes
  const syms=[...new Set([...S.holdings.map(h=>h.sym),...S.wl,...SCORE_DB.slice(0,20).map(d=>d.sym)])];
  const batches=[];for(let i=0;i<syms.length;i+=5)batches.push(syms.slice(i,i+5));
  for(const batch of batches){await Promise.all(batch.map(async sym=>{const q=await getQ(sym);if(q)S.quotes[sym]=q;}));await new Promise(r=>setTimeout(r,200));}
  document.getElementById('lastUpd').textContent='更新 '+new Date().toLocaleTimeString('zh-TW');
  renderAll();fetchSectorHeat();
  setInterval(doRefresh,300000);
}
init();
